<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F-22 Explorer v1.1 — Mobile Mode-Based UI Mockup</title>
  <style>
    :root {
      --bg-canvas: #0b1018;
      --surface-1: rgba(14, 21, 33, 0.94);
      --surface-2: rgba(26, 36, 54, 0.78);
      --border-subtle: rgba(148, 163, 184, 0.22);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --radius-sm: 6px; --radius-md: 16px; --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 390px; height: 844px; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: #0b1018; color: var(--text-primary);
      position: relative;
    }
    .viewport-bg {
      position: absolute; top: 48px; left: 0; right: 0; height: 480px;
      background:
        linear-gradient(rgba(11, 16, 24, 0.08), rgba(11, 16, 24, 0.32)),
        url('../../screenshots/v1.1/desktop-ab-plume-new.png') center/cover no-repeat;
    }
    .mobile-header {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
    }
    .brand-title { font-size: 13px; font-weight: 800; letter-spacing: 0.12em; }
    .menu-btn {
      padding: 5px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-2); color: var(--text-primary);
      font-size: 12px; font-weight: 600;
    }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 58px;
      background: var(--surface-1);
      border-top: 1px solid var(--border-subtle);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      padding: 10px 16px 16px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }
    .handle { width: 38px; height: 4px; border-radius: 99px; background: rgba(148, 163, 184, 0.4); margin: 0 auto; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
    .title { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 6px 11px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-2); color: var(--text-secondary);
      font-size: 12px; font-weight: 600;
    }
    .chip.active { border-color: var(--accent); color: #e0f2fe; background: rgba(56, 189, 248, 0.2); }
    .slider-track { height: 6px; border-radius: 99px; background: #1e293b; position: relative; margin: 6px 0; }
    .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--accent); border-radius: 99px; }
    .slider-thumb { position: absolute; right: 0; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #0b1018; }
    .summary-bar {
      padding: 8px 10px; border-radius: 8px;
      background: rgba(20, 83, 45, 0.28); border: 1px solid rgba(34, 197, 94, 0.45);
      display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #dcfce7;
    }
    .mode-bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 58px;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: rgba(10, 15, 24, 0.98);
      border-top: 1px solid var(--border-subtle);
      padding: 6px 6px 10px; gap: 4px;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--text-muted);
    }
    .tab.active {
      background: rgba(56, 189, 248, 0.18);
      color: #e0f2fe;
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.5);
    }
  </style>
</head>
<body>
  <div class="viewport-bg"></div>

  <header class="mobile-header">
    <span class="brand-title">F-22 RAPTOR</span>
    <button class="menu-btn">⋯ Menu</button>
  </header>

  <section class="sheet">
    <div class="handle"></div>
    <div class="sheet-head">
      <div>
        <div class="kicker">ENGINES MODE · RUNNING</div>
        <div class="title">Throttle &amp; Afterburner</div>
      </div>
      <span class="chip">✕</span>
    </div>

    <div>
      <div style="font-size:12px;color:#cbd5e1;margin-bottom:4px;">Throttle (100%) — AFTERBURNER · ~35,000 lbf (~160 kN)</div>
      <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
    </div>

    <div class="btn-row">
      <span class="chip">Idle (0%)</span>
      <span class="chip">Mil Dry (75%)</span>
      <span class="chip active">Max AB (100%)</span>
    </div>

    <div class="summary-bar">
      <span>✓ Start complete (9/9 steps)</span>
      <span style="color:#7dd3fc;">Show steps ▾</span>
    </div>
  </section>

  <nav class="mode-bar" aria-label="Mobile Explorer Modes">
    <div class="tab">Explore</div>
    <div class="tab">Cockpit</div>
    <div class="tab">Weapons</div>
    <div class="tab active">Engines</div>
  </nav>
</body>
</html>
